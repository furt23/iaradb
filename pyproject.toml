[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "iara"
version = "0.1.0"
description = "Iara: a parallel, vectorized query engine (Rust + Apache Arrow) with a Python API and SQL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Felipe" }]
keywords = ["query-engine", "sql", "dataframe", "arrow", "parquet", "delta-lake", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pyarrow>=14", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/furt23/workhouse_engine"
Repository = "https://github.com/furt23/workhouse_engine"
Issues = "https://github.com/furt23/workhouse_engine/issues"

[project.scripts]
iara = "iara.cli:main"

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars"]
dev = ["pytest", "pandas", "polars", "duckdb", "numpy", "marimo>=0.16", "boto3>=1.34", "moto[server]>=5"]
# the other engines in the benchmarks (Spark also needs Java 17+; chDB has no Windows wheels)
bench = ["duckdb", "polars", "psutil", "datafusion", "daft", "pyspark>=4", "chdb; sys_platform != 'win32'"]

[tool.maturin]
manifest-path = "crates/iara-python/Cargo.toml"
python-source = "python"
module-name = "iara._iara"
profile = "release"
# the Studio's kernel and cloud tooling stay out of the package: it ships the engine, SQL and the Python API
exclude = ["python/iara/kernel/**", "python/iara/cloud/**", "python/iara/*.pdb", "python/iara/*.pyd.old*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deltalake>=1.6.6",
]
