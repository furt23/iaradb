[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "workhouse"
version = "0.1.0"
description = "Workhouse Engine: a parallel, vectorized query engine (Rust + Apache Arrow) with a Python API and SQL"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyarrow>=14", "tomli>=2; python_version < '3.11'"]

[project.scripts]
workhouse = "workhouse.cli:main"

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars"]
studio = ["marimo>=0.16"]
cloud = ["boto3>=1.34"]
dev = ["pytest", "pandas", "polars", "duckdb", "numpy", "marimo>=0.16", "boto3>=1.34", "moto[server]>=5"]

[tool.maturin]
manifest-path = "crates/workhouse-python/Cargo.toml"
python-source = "python"
module-name = "workhouse._workhouse"
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deltalake>=1.6.6",
]
