server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # relative redirects: an absolute one would carry the container port (8080) behind the tunnel
    absolute_redirect off;

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

    # Astro names built assets by content hash, so they never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # pages: /quickstart resolves to /quickstart/index.html (with a redirect to the slash form)
    location / {
        try_files $uri $uri/ =404;
    }

    # Starlight writes 404.html; nginx keeps the 404 status
    error_page 404 /404.html;
}
