name: Release

# Pushing a tag like v0.2.0 builds the wheels, installs and tests each one on its own
# runner, and publishes them to PyPI. Publishing uses Trusted Publishing (OIDC): no token
# is stored in the repository. Run it by hand (workflow_dispatch) to build and test only.
#
# No sdist: the repository is private and an sdist would publish the Rust source.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          # jemalloc for 64 KB pages too: a build for 4 KB pages crashes on ARM kernels with 64 KB pages
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014", docker_options: "-e JEMALLOC_SYS_WITH_LG_PAGE=16" }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-15, target: aarch64 }
          - { os: windows-latest, target: x64 }
    env:
      # replaces .cargo/config.toml's target-cpu=native, which would tie the wheel to the runner's CPU
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          docker-options: ${{ matrix.docker_options }}
          args: --release --strip --out dist
      # the oldest Python the abi3 wheel supports, so a wheel that needs a newer one fails here
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: install and test the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"   # import the installed package, not ./python
          python -c "
          import iara
          t = iara.from_dict({'k': [1, 1, 2], 'v': [1, 2, 3]})
          r = iara.sql('select k, sum(v) as s from t group by k order by k', t=t).collect()
          assert r.to_pydict() == {'k': [1, 2], 's': [3, 3]}, r.to_pydict()
          print('ok', iara.__file__)
          "
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish:
    needs: [wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: tag matches the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
          ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
