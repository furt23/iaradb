[package]
name = "workhouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow.workspace = true
parquet.workspace = true
rayon.workspace = true
hashbrown.workspace = true
foldhash.workspace = true
memmap2.workspace = true
bytes.workspace = true
glob.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
chrono.workspace = true
parking_lot.workspace = true
memchr = "2"
regex = "1"
# Delta Lake transaction log (JSON actions, schema strings, file statistics)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# remote storage (object_store; the "s3" feature adds Amazon S3)
object_store = { version = "0.14", default-features = false, features = ["tokio"] }
# the ObjectStore trait is declared with it (the request-counting wrapper implements it)
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
default = []
s3 = ["object_store/aws-base", "object_store/reqwest", "object_store/ring", "dep:reqwest", "dep:rustls"]
